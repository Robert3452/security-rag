name: commit
on:
  push:
    branches: [main] # push que va a main
  pull_request: # cualquier PR, desde cualquier rama

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rag" --health-interval 5s --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check
      - run: uv run mypy app
      - run: uv run alembic upgrade head
      - run: uv run pytest