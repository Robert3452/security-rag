[project]
name = "backend"
version = "0.1.0"
description = "Asistente RAG de normativa de seguridad eléctrica e industrial"
readme = "README.md"
authors = [
    { name = "Robert3452", email = "romeza1239@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.160.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pypdfium2>=5.14.0",
    "pytesseract>=0.3.13",
    "sqlalchemy[asyncio]>=2.1.6",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = ["pytesseract.*", "pgvector.*"]
ignore_missing_imports = true
